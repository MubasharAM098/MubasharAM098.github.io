<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary Meta Tags -->
    <title>Blog — Mubashar Ashraf | mubi.me</title>
    <meta name="title" content="Blog — Mubashar Ashraf | mubi.me">
    <meta name="description" content="Insights on AI engineering, automation workflows, and lessons learned — by Mubashar Ashraf, Full-Stack AI Engineer.">
    <meta name="author" content="Mubashar Ashraf">
    <meta name="keywords" content="AI engineering, LangGraph, LangChain, automation, Python, machine learning, blog, developer blog">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://mubi.me/blog/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mubi.me/blog/">
    <meta property="og:title" content="Blog — Mubashar Ashraf | mubi.me">
    <meta property="og:description" content="Insights on AI engineering, automation workflows, and lessons learned — by Mubashar Ashraf.">
    <meta property="og:image" content="https://mubi.me/og-image.png">
    <meta property="og:site_name" content="mubi.me">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://mubi.me/blog/">
    <meta name="twitter:title" content="Blog — Mubashar Ashraf | mubi.me">
    <meta name="twitter:description" content="Insights on AI engineering, automation workflows, and lessons learned — by Mubashar Ashraf.">
    <meta name="twitter:image" content="https://mubi.me/og-image.png">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Highlight.js (Atom One Dark theme) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

    <!-- Blog Stylesheet -->
    <link rel="stylesheet" href="style-blog.css">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4851542991688278" crossorigin="anonymous"></script>
</head>
<body>

    <!-- Reading Progress Bar -->
    <div class="reading-progress" id="reading-progress"></div>

    <!-- Navigation -->
    <nav class="blog-nav no-print" id="blog-nav">
        <div class="nav-inner">
            <a href="https://mubi.me" class="nav-logo">mubi<span class="logo-dot">.</span>me</a>
            <div class="nav-links">
                <a href="https://mubi.me">CV</a>
                <a href="https://mubi.me/blog/" class="active">Blog</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="blog-container">

        <!-- ==================== HOME VIEW ==================== -->
        <div id="home-view">
            <!-- Hero -->
            <div class="blog-hero" id="blog-hero">
                <h1>The <span class="hero-accent">Build Log</span></h1>
                <p>Insights on AI engineering, automation workflows, and lessons learned from building real-world systems.</p>
            </div>

            <!-- Tag Filters -->
            <div class="tag-filter-bar" id="tag-filter-bar">
                <!-- Populated by JS -->
            </div>

            <!-- Posts Grid -->
            <div class="posts-grid" id="posts-grid">
                <!-- Loading skeletons (replaced by JS) -->
                <div class="skeleton-card">
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line medium"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line medium"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line long"></div>
                    <div class="skeleton-line medium"></div>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <button class="pagination-btn" id="pagination-prev" disabled>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    Previous
                </button>
                <span class="pagination-info" id="pagination-info">Page 1 of 1</span>
                <button class="pagination-btn" id="pagination-next" disabled>
                    Next
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>
        </div>

        <!-- ==================== POST VIEW ==================== -->
        <div id="post-view" style="display: none;">
            <div class="blog-layout">
                <!-- Article Column -->
                <article>
                    <!-- Back Button -->
                    <a href="#" class="back-to-blog" onclick="window.location.hash='';return false;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Back to Blog
                    </a>

                    <!-- Article Header -->
                    <header class="article-header">
                        <div class="post-card-meta">
                            <span class="post-card-date" id="article-date"></span>
                            <span class="post-card-readtime" id="article-readtime"></span>
                        </div>
                        <h1 class="article-title" id="article-title"></h1>
                        <p class="article-desc" id="article-desc"></p>
                        <div class="article-tags" id="article-tags"></div>
                    </header>

                    <!-- Article Body (Markdown rendered here) -->
                    <div class="article-body" id="article-body">
                    </div>

                    <!-- Post-Article Ad Slot -->
                    <div class="article-ad-slot no-print" id="article-ad-slot">
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-client="ca-pub-4851542991688278"
                             data-ad-slot="auto"
                             data-ad-format="auto"
                             data-full-width-responsive="true"></ins>
                    </div>



                </article>

                <!-- Sidebar -->
                <aside class="blog-sidebar">
                    <!-- Tags -->
                    <div class="sidebar-card">
                        <h3 class="sidebar-card-title">Topics</h3>
                        <div id="sidebar-tags">
                            <!-- Populated by JS -->
                        </div>
                    </div>

                    <!-- Sidebar Ad -->
                    <div class="sidebar-ad-slot no-print">
                        <ins class="adsbygoogle"
                             style="display:block"
                             data-ad-client="ca-pub-4851542991688278"
                             data-ad-slot="auto"
                             data-ad-format="auto"
                             data-full-width-responsive="true"></ins>
                    </div>
                </aside>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="blog-footer">
        <div class="footer-links">
            <a href="https://mubi.me">CV / Portfolio</a>
            <div class="footer-sep"></div>
            <a href="https://mubi.me/blog/">Blog</a>
            <div class="footer-sep"></div>
            <a href="https://mubi.me/privacy-policy">Privacy Policy</a>
            <div class="footer-sep"></div>
            <a href="https://github.com/MubasharAM098" target="_blank" rel="noopener">GitHub</a>
        </div>
        <p class="footer-copy">&copy; 2026 Mubashar Ashraf. Built with ☕ and curiosity.</p>
    </footer>

    <!-- Scroll to Top Button -->
    <button class="scroll-top-btn" id="scroll-top-btn" aria-label="Scroll to top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>

    <!-- CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'default' });</script>

    <!-- Blog Engine -->
    <script src="blog.js"></script>

</body>
</html>
